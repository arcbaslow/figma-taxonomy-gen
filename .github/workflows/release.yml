name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # for PyPI trusted publishing
      contents: read
    environment:
      name: pypi
      url: https://pypi.org/p/figma-taxonomy-gen

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Verify tag matches pyproject version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION=$(uv run --with tomli python -c "import tomli; print(tomli.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match pyproject version $PROJECT_VERSION"
            exit 1
          fi

      - name: Build distributions
        run: uv build

      - name: Publish to PyPI
        if: vars.PUBLISH_TO_PYPI == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

# Publishing is opt-in. Set the repository variable PUBLISH_TO_PYPI to "true"
# (Settings > Secrets and variables > Actions > Variables) once a Trusted
# Publisher is registered on PyPI for this project. Until then a release
# builds and verifies the artifact but does not push it anywhere.
